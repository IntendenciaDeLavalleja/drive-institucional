{% extends "base.html" %}
{% block title %}Verificación · Drive Institucional{% endblock %}
{% block main_class %}auth-shell{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="code-icon">2FA</div>
  <p class="eyebrow">Verificación de identidad</p>
  <h1>Revisá tu correo</h1>
  <p class="muted">Enviamos el código a <strong>{{ email }}</strong>. Vence en pocos minutos.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Código de seis dígitos
      <input class="code-input" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" autofocus>
    </label>
    <button class="button primary wide" type="submit">Ingresar</button>
  </form>
   <a class="text-link" href="{{ url_for('auth.login') }}">Volver al inicio</a>
</section>
{% endblock %}
