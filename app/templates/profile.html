{% extends "base.html" %}
{% block title %}Mi perfil · Drive Institucional{% endblock %}
{% block content %}
<section class="profile-shell">
  <div class="page-heading">
    <div><p class="eyebrow">Cuenta personal</p><h1>Mi perfil</h1><p class="muted">Actualizá tus datos de acceso. Cada campo es opcional.</p></div>
  </div>
  <form method="post" class="file-panel profile-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nombre de usuario<input name="username" value="{{ current_user.username }}" minlength="3" autocomplete="username"></label>
    <label>Correo institucional<input type="email" name="email" value="{{ current_user.email }}" autocomplete="email"></label>
    <div class="profile-divider"><span>Nueva contraseña</span></div>
    <label>Contraseña (opcional)<input type="password" name="password" minlength="12" autocomplete="new-password" placeholder="Dejá vacío para conservarla"></label>
    <p class="muted small">La contraseña debe tener al menos 12 caracteres.</p>
    <button class="button primary" type="submit">Guardar cambios</button>
  </form>
</section>
{% endblock %}
