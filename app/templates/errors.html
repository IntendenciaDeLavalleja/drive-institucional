<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error {{ code }} · Drive Institucional</title>
  <link rel="icon" href="{{ url_for('public_asset', filename='favicon.ico') }}">
   <meta property="og:image" content="{{ url_for('public_asset', filename='Logo.webp', _external=True) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
    .error-card{position:relative;width:min(100%,560px);padding:48px 40px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
    .error-code{display:inline-grid;place-items:center;width:96px;height:96px;margin-bottom:24px;border-radius:24px;background:var(--navy);color:#fff;font-size:34px;font-weight:900;box-shadow:0 14px 30px rgba(8,42,82,.2)}
    .error-card h1{margin:0 0 12px;color:var(--navy);font-size:clamp(26px,5vw,36px);letter-spacing:-.04em}
    .error-card p{margin:0 auto 30px;max-width:400px;color:var(--muted);font-size:16px}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card" role="alert">
      <div class="error-code">{{ code }}</div>
      <h1>{{ error.name if error.name else 'Algo salió mal' }}</h1>
      <p>{{ message }}</p>
    </section>
  </main>
</body>
</html>
